spring:
  application:
    name: approval-engine

  datasource:
    # File mode, not in-memory: state must survive a restart, otherwise the crash-recovery
    # behaviour this engine is built around cannot be demonstrated or trusted.
    # LOCK_TIMEOUT is raised from H2's 1s default: write paths take a row lock on the request
    # for the duration of the transaction, and a burst of simultaneous approvers on one request
    # must queue rather than time out.
    url: jdbc:h2:file:./data/approvals;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      pool-name: approval-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never touch it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Browse the live database at http://localhost:8080/h2-console
  # JDBC URL: jdbc:h2:file:./data/approvals   user: sa   password: (blank)
  #
  # Connecting while the engine is running works because the datasource above sets
  # AUTO_SERVER=TRUE — without it H2 file mode allows only one JVM at a time and the
  # console would fail with "Database may be already in use".
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # Must stay false. True binds the console to every network interface, and it
        # executes arbitrary SQL with no authentication beyond the JDBC password —
        # which is blank here. Localhost-only is the only safe setting for a console
        # that ships enabled.
        web-allow-others: false
        # Query tracing off: it writes every statement to a trace file, which is noise
        # during normal use and grows unbounded.
        trace: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

approval:
  # Outbox dispatcher — pushes decision webhooks to consuming applications.
  outbox:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 20
    lease-duration-seconds: 30
    max-attempts: 8
    # Backoff schedule per attempt (seconds); the last value repeats. Jitter is applied on top.
    backoff-seconds: [2, 5, 15, 60, 300, 900, 3600]
    http:
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
    # Tolerance the *consumer* should allow on X-Approval-Timestamp, published in the docs.
    signature-tolerance-seconds: 300

  # SLA sweeper — expires overdue approval tasks and applies each stage's onTimeout policy.
  sla:
    enabled: true
    poll-interval-ms: 60000
    batch-size: 100

  # Startup recovery — re-drives workflows interrupted by a crash or restart.
  recovery:
    enabled: true

  # Bounded retry when two approvers act on the same request simultaneously.
  concurrency:
    optimistic-retry-attempts: 3
    optimistic-retry-base-backoff-ms: 25

logging:
  level:
    root: INFO
    com.approvalengine: DEBUG
    org.hibernate.SQL: INFO
